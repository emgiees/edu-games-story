<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONTRAKT — gra decyzyjna | FALA × NORDIKA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --ply:#F3EFE6; --ink:#23201B; --muted:#6E675B; --card:#FFFDF7;
  --amber:#E8A013; --amber-d:#C4880D; --steel:#33566B; --steel-l:#E4EBEF;
  --ok:#2F7D4F; --ok-l:#E4F0E9; --bad:#B3402E; --bad-l:#F6E6E2;
  --line:#D8D2C4; --line-d:#B9B19E;
  --f-disp:'Oswald',sans-serif; --f-body:'Source Sans 3',sans-serif; --f-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ply);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body{background-image:repeating-linear-gradient(0deg,transparent,transparent 47px,rgba(35,32,27,.025) 47px,rgba(35,32,27,.025) 48px)}
h1,h2,h3,h4{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.04em;margin:0 0 .5em;font-weight:600}
h1{font-size:1.9rem}h2{font-size:1.35rem}h3{font-size:1.08rem}h4{font-size:.92rem;color:var(--muted)}
p{margin:.4em 0}
button{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;font-size:.85rem;font-weight:600;
  border:2px solid var(--ink);background:var(--amber);color:var(--ink);padding:.55em 1.1em;cursor:pointer;
  box-shadow:2px 2px 0 var(--ink);transition:transform .05s, box-shadow .05s}
button:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:none}
button:disabled{background:var(--line);color:var(--muted);border-color:var(--line-d);box-shadow:none;cursor:not-allowed;transform:none}
button.b2{background:var(--card)} button.b3{background:var(--steel);color:#fff}
button.bsm{font-size:.72rem;padding:.35em .7em;box-shadow:1px 1px 0 var(--ink)}
input,select,textarea{font-family:var(--f-mono);font-size:.95rem;border:1.5px solid var(--line-d);background:#fff;
  padding:.4em .5em;color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
input.num{width:110px;text-align:right}
input.bad{border-color:var(--bad);background:var(--bad-l)}
table{border-collapse:collapse;font-size:.9rem}
th,td{border:1px solid var(--line-d);padding:.3em .55em;text-align:right;font-family:var(--f-mono)}
th{background:var(--steel-l);font-family:var(--f-disp);font-weight:600;text-transform:uppercase;font-size:.72rem;letter-spacing:.05em;text-align:center}
td.l,th.l{text-align:left;font-family:var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
/* shift board (naglowek) */
.board{background:var(--ink);color:var(--ply);padding:10px 16px;position:sticky;top:0;z-index:50;border-bottom:4px solid var(--amber)}
.board .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.board .logo{font-family:var(--f-disp);font-weight:700;font-size:1.3rem;letter-spacing:.12em}
.board .logo em{color:var(--amber);font-style:normal}
.board .tag{font-family:var(--f-mono);font-size:.72rem;color:#BFB8A8}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.kpi{text-align:right;min-width:86px}
.kpi .v{font-family:var(--f-mono);font-weight:600;font-size:1.0rem;color:#fff}
.kpi .l{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:#BFB8A8}
.kpi .d{font-family:var(--f-mono);font-size:.68rem}
.up{color:#7FD49B}.down{color:#F09A8A}
/* zakladki */
.tabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
.tabs button{background:var(--card)}
.tabs button.on{background:var(--amber)}
/* przywieszka (karta zadania) */
.tagcard{position:relative;background:var(--card);border:1.5px solid var(--line-d);padding:14px 16px 12px 34px;
  box-shadow:3px 3px 0 rgba(35,32,27,.12);cursor:pointer}
.tagcard:hover{border-color:var(--ink)}
.tagcard.sel{border-color:var(--ink);border-width:2px;background:#FFF9EC}
.tagcard::before{content:'';position:absolute;left:11px;top:16px;width:11px;height:11px;border-radius:50%;
  background:var(--ply);border:2px solid var(--line-d);box-shadow:inset 1px 1px 2px rgba(0,0,0,.15)}
.tagcard .tt{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;font-size:.92rem;letter-spacing:.03em}
.tagcard .meta{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);margin-top:2px}
.tagrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:10px 0 20px}
/* stempel */
.stamp{display:inline-block;font-family:var(--f-disp);font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  font-size:.78rem;padding:.15em .6em;border:2.5px solid;transform:rotate(-4deg);opacity:.92;background:transparent}
.stamp.ok{color:var(--ok);border-color:var(--ok)}
.stamp.bad{color:var(--bad);border-color:var(--bad)}
.stamp.wait{color:var(--muted);border-color:var(--muted)}
.stamp.big{font-size:1.1rem;padding:.25em .8em}
@media (prefers-reduced-motion:no-preference){
  .stamp.pop{animation:stampin .28s cubic-bezier(.2,2.2,.4,1) both}
  @keyframes stampin{from{transform:rotate(-4deg) scale(2.1);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:.92}}
}
/* panele */
.panel{background:var(--card);border:1.5px solid var(--line-d);padding:18px 20px;margin:0 0 16px;box-shadow:3px 3px 0 rgba(35,32,27,.10)}
.panel.amber{border-left:6px solid var(--amber)}
.panel.steel{border-left:6px solid var(--steel)}
.panel.bad{border-left:6px solid var(--bad);background:var(--bad-l)}
.panel.ok{border-left:6px solid var(--ok);background:var(--ok-l)}
.fb{font-size:.88rem;margin:.25em 0;padding-left:1em;text-indent:-1em}
.fb::before{content:'▸ ';color:var(--amber-d)}
/* dialog fabularny */
.dlg{display:flex;gap:12px;margin:10px 0;align-items:flex-start}
.dlg .av{flex:0 0 42px;height:42px;background:var(--steel);color:#fff;font-family:var(--f-disp);font-weight:700;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;border:2px solid var(--ink)}
.dlg.nar .av{background:var(--line);color:var(--muted);border-color:var(--line-d)}
.dlg .bub{background:var(--card);border:1.5px solid var(--line-d);padding:10px 14px;flex:1}
.dlg .who{font-family:var(--f-disp);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dlg.nar .bub{background:transparent;border:none;font-style:italic;color:var(--muted);padding:4px 0}
/* wywiady */
.npcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hintbox{background:var(--steel-l);border-left:4px solid var(--steel);padding:8px 12px;font-size:.85rem;margin-top:8px}
/* leaderboard */
.lb th{background:var(--ink);color:var(--ply)}
.lb tr.me{background:#FFF3D6}
.badge{display:inline-block;font-family:var(--f-mono);font-size:.68rem;background:var(--steel);color:#fff;padding:.1em .5em;margin-left:.4em;vertical-align:middle}
/* konsola: macierz */
.mx td{font-size:.78rem;padding:.25em .4em}
.mx .s100{background:var(--ok-l)} .mx .s60{background:#FDF3D7} .mx .s0{background:var(--bad-l)} .mx .sw{background:#fff}
/* lb click zones e2_2 */
.lbtask{display:inline-block;border:2px solid var(--ink);background:#fff;font-family:var(--f-mono);font-size:.8rem;
  padding:.3em .55em;margin:3px;cursor:pointer;box-shadow:2px 2px 0 rgba(35,32,27,.25)}
.lbtask.sel{background:var(--amber)}
.lbtask.done{background:var(--steel-l)}
.station{border:2px dashed var(--line-d);min-height:64px;padding:8px;background:#FCFAF3}
.station.over{border-color:var(--bad);background:var(--bad-l)}
.mono{font-family:var(--f-mono)}
.small{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.projector h1{font-size:2.6rem}
.projector .lb{font-size:1.15rem}
a{color:var(--steel)}
.evbanner{background:var(--bad);color:#fff;padding:10px 16px;font-family:var(--f-disp);text-transform:uppercase;
  letter-spacing:.06em;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);margin:0 0 14px}
.evbanner .body{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:.9rem;margin-top:4px}
.landing{max-width:560px;margin:7vh auto;text-align:center}
.landing .big{font-size:3.2rem;font-family:var(--f-disp);font-weight:700;letter-spacing:.14em}
.landing .big em{color:var(--amber);font-style:normal}
.landing .sub{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin:-6px 0 26px}
.hr{border:none;border-top:1.5px dashed var(--line-d);margin:14px 0}
.dl{border:2px solid var(--steel);background:var(--steel-l);padding:10px 14px;margin:10px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="engines.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
