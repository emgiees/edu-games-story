<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KONTRAKT — test sprawdzający, Epizod 1</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{--ply:#F3EFE6;--ink:#23201B;--muted:#6E675B;--card:#FFFDF7;--amber:#E8A013;--steel:#33566B;--steel-l:#E4EBEF;
  --ok:#2F7D4F;--ok-l:#E4F0E9;--bad:#B3402E;--bad-l:#F6E6E2;--line:#D8D2C4;--line-d:#B9B19E;
  --f-disp:'Oswald',sans-serif;--f-body:'Source Sans 3',sans-serif;--f-mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ply);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
.board{background:var(--ink);color:var(--ply);padding:12px 16px;border-bottom:4px solid var(--amber);position:sticky;top:0;z-index:5}
.board .in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;font-size:1.2rem}.logo em{color:var(--amber);font-style:normal}
.tag{font-family:var(--f-mono);font-size:.75rem;color:#BFB8A8}
h1,h2,h3{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin:.6em 0 .4em}
h1{font-size:1.6rem}h2{font-size:1.2rem}
.panel{background:var(--card);border:1.5px solid var(--line-d);padding:16px;margin:16px 0;box-shadow:3px 3px 0 rgba(35,32,27,.10)}
.q .nr{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.q p.t{font-weight:600;margin:.2em 0 .6em}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);background:#fff;padding:10px 12px;margin:6px 0;cursor:pointer;min-height:44px}
.opt input{margin-top:4px;width:18px;height:18px;flex:0 0 auto}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}.opt.bad{border-color:var(--bad);background:var(--bad-l)}
.q.done .opt{cursor:default}
.expl{display:none;background:var(--steel-l);border-left:4px solid var(--steel);padding:8px 12px;margin-top:8px;font-size:.95rem}
.q.done .expl{display:block}
.verdict{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;margin-top:6px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
input.txt{font-family:var(--f-mono);font-size:1.1rem;border:1.5px solid var(--line-d);padding:.5em .6em;width:100%;background:#fff}
input.txt:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
button{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;font-size:1rem;font-weight:600;border:2px solid var(--ink);
  background:var(--amber);color:var(--ink);padding:.7em 1.2em;cursor:pointer;box-shadow:2px 2px 0 var(--ink);width:100%;margin-top:10px}
button.b2{background:var(--card)}
.err{color:var(--bad);margin:.4em 0}
.small{font-size:.85rem;color:var(--muted)}
.score{font-family:var(--f-disp);font-size:2.4rem;font-weight:700;letter-spacing:.06em}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line-d);padding:.35em .5em;text-align:left}
th{background:var(--steel-l);font-family:var(--f-disp);text-transform:uppercase;font-size:.75rem;letter-spacing:.05em}
td.n{text-align:right;font-family:var(--f-mono)}
.qr{text-align:center}.qr img{width:min(80vw,70vh);height:auto;image-rendering:pixelated;border:8px solid #fff}
.qr .url{font-family:var(--f-mono);font-size:1.3rem;word-break:break-all}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
</head>
<body>
<div class="board"><div class="in"><div class="logo">KON<em>TRAKT</em></div><div class="tag">test sprawdzający · Epizod 1 „Audyt”</div></div></div>
<div class="wrap" id="app"></div>
<script>
/* Test do samosprawdzenia (nieoceniany). Wyniki: kontrakt-test/<QUIZ_ID>/<id>.
   Widoki: test.html (studenci), test.html?qr (kod QR na rzutnik), test.html?wyniki (lista wyników). */
var QUIZ_ID = 'e1';
var PAGE_URL = 'https://emgiees.github.io/edu-games-story/operations/test.html';

var PYTANIA = [
  { t: 'Płyty wiórowe zamawiane są dopiero wtedy, gdy planistka zauważy pusty regał. Którą metodą należy się tym zająć?',
    o: ['Prognozowanie i MRP', 'Optymalizacja przewozów', 'Harmonogramowanie i balansowanie', 'Normowanie i wartościowanie pracy'], a: 0,
    e: 'Brak planu zakupów materiałów to problem obszaru „materiały i zapasy”: prognoza popytu → MPS → MRP wyznacza, ile i kiedy zamówić.' },
  { t: 'Okleiniarka staje kilka razy w tygodniu, a zlecenia idą na maszyny w kolejności zgłoszeń. Który obszar metod jest właściwy?',
    o: ['Prognozowanie i MRP', 'Harmonogramowanie i balansowanie', 'Optymalizacja przewozów', 'Normowanie i wartościowanie pracy'], a: 1,
    e: 'Przestoje i kolejność zleceń na maszynach to produkcja i zdolności: harmonogramowanie, wąskie gardło, balansowanie.' },
  { t: 'Sprzedaż w trzech ostatnich miesiącach: 120, 130, 140 szt. Ile wynosi prognoza na następny miesiąc średnią ruchomą z 3 okresów?',
    o: ['130 szt.', '140 szt.', '150 szt.', '135 szt.'], a: 0,
    e: 'MA(3) = (120 + 130 + 140) / 3 = 130. Średnia ruchoma nie „widzi” trendu, dlatego przy rosnącej sprzedaży systematycznie zaniża prognozę.' },
  { t: 'Wygładzanie wykładnicze, α = 0,3. Prognoza na ten miesiąc wynosiła 180, a sprzedaż rzeczywista 200. Ile wynosi prognoza na następny miesiąc?',
    o: ['186', '194', '190', '200'], a: 0,
    e: 'F(t+1) = α·A(t) + (1 − α)·F(t) = 0,3·200 + 0,7·180 = 60 + 126 = 186.' },
  { t: 'Co się dzieje, gdy w wygładzaniu wykładniczym zwiększymy α (np. z 0,1 do 0,7)?',
    o: ['Prognoza silniej reaguje na najnowsze dane, ale jest bardziej „nerwowa”', 'Prognoza staje się gładsza i wolniej reaguje na zmiany', 'Prognoza zaczyna uwzględniać trend', 'Nic, α wpływa tylko na MAPE'], a: 0,
    e: 'α to waga ostatniej obserwacji. Duże α = szybka reakcja i więcej szumu; małe α = wygładzenie i opóźnienie.' },
  { t: 'Sprzedaż rzeczywista: 100 i 200 szt., prognozy: 110 i 180 szt. Ile wynosi MAPE?',
    o: ['10%', '15%', '20%', '5%'], a: 0,
    e: 'Błędy procentowe: |100 − 110| / 100 = 10% oraz |200 − 180| / 200 = 10%. Średnia = 10%.' },
  { t: 'Trzy metody prognozowania dały w walidacji wstecznej MAPE: MA(3) 12,4%, wygładzanie 9,1%, trend 6,8%. Którą wybrać?',
    o: ['Trend liniowy (najniższe MAPE)', 'Średnią ruchomą (najprostsza)', 'Wygładzanie wykładnicze (zawsze najlepsze)', 'Średnią z trzech prognoz'], a: 0,
    e: 'O wyborze decyduje walidacja wsteczna, a nie przyzwyczajenie: wybieramy metodę z najmniejszym błędem na danych historycznych.' },
  { t: 'Wyznaczono trend liniowy y = 50 + 4t (t = 1 to pierwszy miesiąc danych). Mamy 12 miesięcy historii. Ile wynosi prognoza na miesiąc 13?',
    o: ['102', '98', '54', '106'], a: 0,
    e: 'y(13) = 50 + 4·13 = 50 + 52 = 102.' },
  { t: 'Na jakie pytanie odpowiada jednoczynnikowa analiza wariancji (ANOVA)?',
    o: ['Czy średnie w kilku grupach (np. zmianach roboczych) różnią się istotnie', 'O ile wzrośnie zmienna Y, gdy X wzrośnie o 1', 'Jaka będzie wartość w następnym okresie', 'Czy dwie zmienne mają rozkład normalny'], a: 0,
    e: 'ANOVA odpowiada „czy grupy się różnią”, regresja – „o ile i od czego”.' },
  { t: 'W ANOVA (α = 0,05) otrzymano F = 5,2, a wartość krytyczna F wynosi 3,47. Wniosek?',
    o: ['Odrzucamy H0: średnie w grupach różnią się istotnie', 'Brak podstaw do odrzucenia H0: grupy się nie różnią', 'Należy zwiększyć α do 0,10', 'Test jest nierozstrzygnięty'], a: 0,
    e: 'F obliczone > F krytyczne, więc różnice między grupami są statystycznie istotne (odrzucamy hipotezę o równości średnich).' },
  { t: 'Model regresji: braki (%) = 1,2 + 0,08 · nadgodziny (h/tydz.). Jak interpretować 0,08?',
    o: ['Każda dodatkowa godzina nadgodzin zwiększa braki średnio o 0,08 p.p.', 'Przy zerowych nadgodzinach braki wynoszą 0,08%', 'Nadgodziny wyjaśniają 8% zmienności braków', 'Braki rosną o 8% na każdą godzinę'], a: 0,
    e: 'Współczynnik kierunkowy b mówi, o ile średnio zmienia się Y przy wzroście X o jednostkę. 1,2 to wyraz wolny (braki przy 0 h).' },
  { t: 'Współczynnik determinacji R² = 0,64. Co to oznacza?',
    o: ['Model wyjaśnia 64% zmienności zmiennej objaśnianej', 'Korelacja wynosi 0,64', '64% obserwacji leży na linii regresji', 'Model myli się średnio o 36%'], a: 0,
    e: 'R² to udział zmienności Y wyjaśnionej przez model. (Korelacja r wynosiłaby tu √0,64 = 0,8.)' },
  { t: 'MRP: potrzeby brutto w tygodniu 6 = 500 szt., zapas dostępny 120 szt., dostawa w drodze 80 szt., zapas bezpieczeństwa 0. Ile wynoszą potrzeby netto?',
    o: ['300 szt.', '380 szt.', '420 szt.', '500 szt.'], a: 0,
    e: 'Netto = brutto − zapas − dostawy w drodze = 500 − 120 − 80 = 300.' },
  { t: 'Potrzeby netto przypadają na tydzień 6, a cykl dostawy (lead time) wynosi 2 tygodnie. Kiedy należy uruchomić zamówienie?',
    o: ['W tygodniu 4', 'W tygodniu 6', 'W tygodniu 8', 'W tygodniu 2'], a: 0,
    e: 'Planowane uruchomienie = termin potrzeby − lead time = 6 − 2 = tydzień 4. Cykl dostawy przesuwa zamówienie wstecz.' },
  { t: 'Potrzeby netto = 230 szt., a dostawca przyjmuje zamówienia w wielokrotnościach 100 szt. Ile zamawiamy?',
    o: ['300 szt.', '230 szt.', '200 szt.', '330 szt.'], a: 0,
    e: 'Zaokrąglamy w górę do najbliższej wielokrotności partii: 300. Nadwyżka 70 szt. przechodzi jako zapas do kolejnego okresu. (Przy partii „na partię”, L4L, zamówilibyśmy 230.)' },
  { t: 'Norma: 4 m² płyty na szafę, wyprodukowano 100 szaf, zużyto 430 m². Cena standardowa 20 zł/m², rzeczywista 22 zł/m². Ile wynosi odchylenie ilościowe?',
    o: ['600 zł niekorzystne', '860 zł niekorzystne', '660 zł niekorzystne', '200 zł korzystne'], a: 0,
    e: 'Odchylenie ilościowe = (zużycie rzeczywiste − zużycie normatywne) · cena standardowa = (430 − 400) · 20 = 600 zł (zużyto więcej niż norma).' },
  { t: 'Te same dane: ile wynosi odchylenie cenowe?',
    o: ['860 zł niekorzystne', '800 zł niekorzystne', '600 zł niekorzystne', '60 zł niekorzystne'], a: 0,
    e: 'Odchylenie cenowe = (cena rzeczywista − cena standardowa) · ilość rzeczywista = (22 − 20) · 430 = 860 zł. Razem z ilościowym: 1 460 zł = 430·22 − 400·20.' },
  { t: 'Z kim rozmawiać o odchyleniu cenowym, a z kim o ilościowym?',
    o: ['Cenowe: zakupy/dostawca; ilościowe: produkcja (hala)', 'Cenowe: hala; ilościowe: dostawca', 'Oba z działem kadr', 'Oba wyłącznie z księgowością'], a: 0,
    e: 'Analiza odchyleń rozdziela dwie różne rozmowy: o cenach z dostawcą, o zużyciu i normach z halą.' }
];

var app = document.getElementById('app');
var qs = new URLSearchParams(location.search);
var db = null, dbNote = '';
try {
  /* config.js deklaruje FIREBASE_CONFIG przez const, więc nie ma go w window */
  if (typeof firebase !== 'undefined' && typeof FIREBASE_CONFIG !== 'undefined' && String(FIREBASE_CONFIG.apiKey).indexOf('WKLEJ') !== 0) {
    firebase.initializeApp(FIREBASE_CONFIG); db = firebase.database();
  }
} catch (e) { console.error(e); }
function ref(p) { return db.ref('kontrakt-test/' + QUIZ_ID + (p ? '/' + p : '')); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function getIdx() { try { return localStorage.getItem('kontrakt_test_index') || ''; } catch (e) { return ''; } }
function setIdx(v) { try { localStorage.setItem('kontrakt_test_index', v); } catch (e) {} }

/* ---------- widok: kod QR na rzutnik ---------- */
function viewQR() {
  app.innerHTML = '<div class="panel qr"><h1>Test sprawdzający — Epizod 1</h1><p>Zeskanuj telefonem:</p>' +
    '<img src="test-qr.png" alt="Kod QR do testu"><p class="url">' + PAGE_URL.replace('https://', '') + '</p>' +
    '<p class="small">Test nie jest oceniany. Podajesz tylko numer indeksu.</p></div>';
}

/* ---------- widok: wyniki dla prowadzącego ---------- */
function viewResults() {
  app.innerHTML = '<div class="panel"><h1>Wyniki testu</h1><p class="small">Na żywo. Każde podejście to osobny wiersz.</p><div id="res">Ładowanie…</div></div>';
  if (!db) { document.getElementById('res').textContent = 'Brak połączenia z Firebase.'; return; }
  ref().on('value', function (s) {
    var v = s.val() || {}, rows = Object.keys(v).map(function (k) { return v[k]; }).sort(function (a, b) { return b.ts - a.ts; });
    var today = new Date().toDateString();
    var todayRows = rows.filter(function (r) { return new Date(r.ts).toDateString() === today; });
    var avg = todayRows.length ? Math.round(todayRows.reduce(function (s, r) { return s + r.score / r.total; }, 0) / todayRows.length * 100) : 0;
    var perQ = PYTANIA.map(function () { return 0; });
    todayRows.forEach(function (r) { (r.answers || []).forEach(function (ok, i) { if (ok) perQ[i]++; }); });
    var h = '<p><b>Dziś: ' + todayRows.length + ' podejść, średnio ' + avg + '%.</b></p>';
    if (todayRows.length) {
      h += '<h2>Trudność pytań (dziś)</h2><table><tr><th>Pyt.</th><th>Poprawnie</th><th>Temat</th></tr>' + PYTANIA.map(function (q, i) {
        return '<tr><td class="n">' + (i + 1) + '</td><td class="n">' + Math.round(perQ[i] / todayRows.length * 100) + '%</td><td>' + esc(q.t.slice(0, 70)) + '…</td></tr>';
      }).join('') + '</table>';
    }
    h += '<h2>Wszystkie podejścia</h2><table><tr><th>Indeks</th><th>Wynik</th><th>Kiedy</th></tr>' + rows.map(function (r) {
      return '<tr><td class="n">' + esc(r.index) + '</td><td class="n">' + r.score + ' / ' + r.total + '</td><td>' + new Date(r.ts).toLocaleString('pl-PL') + '</td></tr>';
    }).join('') + '</table>';
    document.getElementById('res').innerHTML = h;
  }, function (e) { document.getElementById('res').textContent = 'Nie można odczytać wyników (' + (e.code || e.message) + '). Sprawdź reguły Firebase: gałąź "kontrakt-test".'; });
}

/* ---------- widok: student ---------- */
function viewStart(msg) {
  app.innerHTML = '<div class="panel"><h1>Sprawdź się: Epizod 1</h1>' +
    '<p>' + PYTANIA.length + ' pytań z prognozowania, ANOVA i regresji, MRP oraz analizy odchyleń. Test <b>nie jest oceniany</b>: po zakończeniu zobaczysz poprawne odpowiedzi z wyjaśnieniem. Możesz podejść kilka razy.</p>' +
    '<p><label for="idx"><b>Numer indeksu</b></label><br><input id="idx" class="txt" inputmode="numeric" autocomplete="off" maxlength="8" value="' + esc(getIdx()) + '" placeholder="np. 123456"></p>' +
    (msg ? '<p class="err">' + esc(msg) + '</p>' : '') + '<button id="go">Zaczynam</button></div>';
  document.getElementById('go').onclick = function () {
    var v = document.getElementById('idx').value.replace(/\s/g, '');
    if (!/^[0-9]{4,8}$/.test(v)) { viewStart('Podaj numer indeksu (same cyfry, 4–8 znaków).'); return; }
    setIdx(v); viewQuiz(v);
  };
}

function viewQuiz(idx) {
  var order = PYTANIA.map(function (q, i) { return { q: q, i: i, opts: shuffle(q.o.map(function (t, k) { return { t: t, k: k }; })) }; });
  var h = '<p class="small" style="margin-top:14px">Indeks: <b>' + esc(idx) + '</b> · zaznacz po jednej odpowiedzi w każdym pytaniu.</p>';
  order.forEach(function (x, n) {
    h += '<div class="panel q" id="q' + n + '"><div class="nr">Pytanie ' + (n + 1) + ' / ' + order.length + '</div><p class="t">' + esc(x.q.t) + '</p>' +
      x.opts.map(function (o) { return '<label class="opt" data-k="' + o.k + '"><input type="radio" name="q' + n + '" value="' + o.k + '"><span>' + esc(o.t) + '</span></label>'; }).join('') +
      '<div class="verdict"></div><div class="expl">' + esc(x.q.e) + '</div></div>';
  });
  h += '<p class="err" id="miss"></p><button id="check">Sprawdź odpowiedzi</button>';
  app.innerHTML = h; window.scrollTo(0, 0);
  document.getElementById('check').onclick = function () {
    var missing = [];
    order.forEach(function (x, n) { if (!document.querySelector('input[name="q' + n + '"]:checked')) missing.push(n + 1); });
    if (missing.length) { document.getElementById('miss').textContent = 'Brak odpowiedzi w pytaniach: ' + missing.join(', ') + '.'; return; }
    var answers = PYTANIA.map(function () { return false; }), score = 0;
    order.forEach(function (x, n) {
      var box = document.getElementById('q' + n), chosen = +document.querySelector('input[name="q' + n + '"]:checked').value, ok = chosen === x.q.a;
      answers[x.i] = ok; if (ok) score++;
      box.classList.add('done');
      box.querySelectorAll('input').forEach(function (r) { r.disabled = true; });
      box.querySelectorAll('.opt').forEach(function (l) { var k = +l.getAttribute('data-k'); if (k === x.q.a) l.classList.add('ok'); else if (k === chosen) l.classList.add('bad'); });
      var v = box.querySelector('.verdict'); v.textContent = ok ? 'Dobrze' : 'Źle: poprawna odpowiedź zaznaczona na zielono'; v.className = 'verdict ' + (ok ? 'ok' : 'bad');
    });
    var pct = Math.round(score / PYTANIA.length * 100);
    var sum = document.createElement('div'); sum.className = 'panel';
    sum.innerHTML = '<div class="score">' + score + ' / ' + PYTANIA.length + ' (' + pct + '%)</div><p>' +
      (pct >= 80 ? 'Świetnie, materiał Epizodu 1 masz opanowany.' : pct >= 50 ? 'Nieźle. Przejrzyj wyjaśnienia przy błędnych odpowiedziach.' : 'Warto wrócić do debriefingu Epizodu 1 i wyjaśnień poniżej.') +
      '</p><p class="small" id="save">Zapisywanie wyniku…</p>';
    var again = document.createElement('button'); again.className = 'b2'; again.textContent = 'Spróbuj jeszcze raz';
    again.onclick = function () { viewQuiz(idx); };
    var btn = document.getElementById('check'); btn.replaceWith(again);
    app.insertBefore(sum, app.firstChild.nextSibling); window.scrollTo(0, 0);
    var saveEl = document.getElementById('save');
    if (!db) { saveEl.textContent = 'Wynik nie został zapisany (brak połączenia z bazą), ale możesz przejrzeć odpowiedzi.'; return; }
    ref().push({ index: idx, score: score, total: PYTANIA.length, answers: answers, ts: Date.now() })
      .then(function () { saveEl.textContent = 'Wynik zapisany.'; })
      .catch(function (e) { console.error(e); saveEl.textContent = 'Wynik nie został zapisany (' + (e.code || e.message) + '), ale możesz przejrzeć odpowiedzi.'; });
  };
}

if (qs.has('qr')) viewQR(); else if (qs.has('wyniki')) viewResults(); else viewStart();
</script>
</body>
</html>
