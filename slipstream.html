<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLIPSTREAM — a market in fifteen quarters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================ TOKENS */
:root{
  --bg:#ECEEF1; --surface:#FFFFFF; --ink:#182430; --mut:#5C6B7A; --line:#D4DAE1;
  --accent:#2853F0; --accent-soft:#E4EAFE; --warn:#E0491F; --warn-soft:#FCEAE3;
  --ok:#1B9E6B; --ok-soft:#E2F4EC;
  --disp:'Archivo',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
  --r:10px; --shadow:0 1px 2px rgba(24,36,48,.06),0 4px 14px rgba(24,36,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
#root{min-height:100vh}
h1,h2,h3,h4{font-family:var(--disp);margin:0}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============================================================ LAYOUT */
.app{max-width:1240px;margin:0 auto;padding:0 16px 60px}
.content{margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
@media(max-width:960px){.grid2,.grid3{grid-template-columns:1fr}}

/* ============================================================ TOPBAR */
.topbar{display:flex;align-items:center;gap:18px;padding:14px 0 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--disp);font-weight:800;font-stretch:115%;letter-spacing:.02em;font-size:19px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;color:var(--mut);font-size:12px}
.jersey{display:inline-block;width:14px;height:14px;border-radius:4px;flex:none}
.jersey.big{width:30px;height:30px;border-radius:8px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.14)}
.jersey.big.console{background:repeating-linear-gradient(45deg,var(--ink),var(--ink) 6px,#fff 6px,#fff 12px)}
.phase{margin-left:auto;text-align:right}
.phase b{font-family:var(--disp);font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:22px;letter-spacing:.03em;display:block}
.phase span{color:var(--mut);font-size:12px}
.topstats{display:flex;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;min-width:96px;text-align:right}
.stat-v{font-family:var(--mono);font-weight:600;font-size:16px}
.stat-l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stat.warn .stat-v{color:var(--warn)}
.stat.rating-A .stat-v,.stat.rating-B .stat-v{color:var(--ok)}
.stat.rating-D .stat-v,.stat.rating-E .stat-v{color:var(--warn)}
@media(max-width:760px){.topstats{width:100%;justify-content:space-between}.phase{margin-left:0}}

/* =========================================================== PELOTON */
.peloton{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);scrollbar-width:thin}
.rider{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;flex:none;font-size:13px}
.rider .pos{font-family:var(--disp);font-weight:900;font-stretch:125%;width:20px;text-align:center;font-size:14px}
.rider .rname{font-weight:600;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rider .gap{font-family:var(--mono);color:var(--mut);font-size:12px}
.rider.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rider.rcv{opacity:.68}
.rider.rcv .gap{color:var(--warn)}

/* ============================================================= CARDS */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;overflow:auto}
.card.tight{padding:10px 12px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card-head h3{font-weight:800;font-stretch:112%;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.banner{border-radius:var(--r);padding:10px 14px;margin:10px 0;font-weight:500}
.banner.warn{background:var(--warn-soft);color:#8C2B0E;border:1px solid #F0BFA9}
.banner.ok{background:var(--ok-soft);color:#0D5C3D;border:1px solid #B4E0CC}

/* ============================================================== TABS */
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:2px solid var(--ink);overflow-x:auto}
.tab{background:none;border:none;padding:9px 14px;font-weight:600;font-size:14px;color:var(--mut);border-radius:8px 8px 0 0;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff}
.tab:hover:not(.on){background:#DDE2E8}

/* ============================================================ INPUTS */
.txt,.sel,.num{font-family:var(--body);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
.num{font-family:var(--mono);text-align:right}
.numwrap{display:inline-flex;align-items:center;gap:4px}
.numwrap em{font-style:normal;color:var(--mut);font-size:12px}
.sel{width:auto}
.lbl{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);flex-wrap:wrap}
.lbl .mini{font-weight:400}
.lbl.grow{flex:1;min-width:220px}
.lbl.grow .txt{flex:1}
.btn{border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px}
.btn:hover{background:#F2F4F7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1E42C8}
.btn.big{font-size:16px;padding:12px 22px;font-family:var(--disp);font-weight:800;font-stretch:110%;text-transform:uppercase;letter-spacing:.03em}
.btn.small{padding:5px 10px;font-size:13px}
.btn.tiny{padding:3px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--mut)}
.toggle.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ============================================================= TYPES */
.mini{font-size:12px;color:var(--mut)}
.mono{font-family:var(--mono)}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.foot{display:block;margin-top:10px}
.empty{color:var(--mut);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.hint{font-size:13px;color:var(--mut)} .hint.warn{color:var(--warn)} .hint.center{text-align:center}
.grow{flex:1}

/* ============================================================== WIRE */
.wire{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow-y:auto}
.wire-item{display:flex;gap:10px;padding:7px 10px;border-left:3px solid var(--line);background:#F7F8FA;border-radius:0 8px 8px 0;font-size:14px}
.wire-q{font-family:var(--mono);color:var(--mut);flex:none;font-size:12px;padding-top:2px}
.wire-item.t-event{border-left-color:var(--warn);background:var(--warn-soft)}
.wire-item.t-poach{border-left-color:#8A3FD1}
.wire-item.t-share{border-left-color:var(--ok)}
.wire-item.t-price{border-left-color:var(--accent)}
.wire-item.t-receiver{border-left-color:var(--warn)}
.wire-item.t-trade{border-left-color:#0FA3A3}
.wire.big .wire-item{font-size:17px;padding:10px 14px}

/* ============================================================ TABLES */
table.fin{width:100%;border-collapse:collapse;font-size:14px}
table.fin td,table.fin th{padding:5px 6px;border-bottom:1px solid #EDF0F3;vertical-align:top}
table.fin th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left}
table.fin th.r,table.fin td.r{text-align:right;font-family:var(--mono);font-size:13.5px}
table.fin tr.strong td{font-weight:700;border-top:1px solid var(--line)}
table.fin tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
table.fin.wide{min-width:760px}
.rowlink{cursor:pointer}
.rowlink:hover td{background:#F4F6FF}
.notes{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}

/* ========================================================== SEGMENTS */
.segblock{margin-bottom:14px}
.segline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.segline b{font-family:var(--disp);font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:14px;letter-spacing:.04em}
.sharebar{display:flex;height:18px;border-radius:5px;overflow:hidden;background:#DFE3E8}
.sharebar.tall{height:30px}
.sharebar i{display:block;height:100%;border-right:2px solid var(--bg)}
.sharebar i.mine{box-shadow:inset 0 0 0 2px #fff}
.pricerow{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.pricechip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:12px;background:#F2F4F7;border-radius:6px;padding:2px 7px}
.pricechip i{width:9px;height:9px;border-radius:3px}
.pricechip.mine{outline:2px solid var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px}
.chip i{width:11px;height:11px;border-radius:4px;flex:none}
.chip.dim{color:var(--mut)}

/* ===================================================== DECISION FORMS */
.capstrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.segcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.segcard{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:#FBFCFD}
.segcard.off{opacity:.65;background:#F1F3F5}
.segcard-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.segcard-head b{font-family:var(--disp);font-weight:800;font-stretch:115%;text-transform:uppercase;letter-spacing:.04em}
.segcard-body{display:flex;flex-direction:column;gap:8px}
.ue{display:flex;flex-direction:column;gap:3px;font-size:13px;border-top:1px dashed var(--line);padding-top:8px}
.ue em{font-style:normal;color:var(--mut);font-size:12px}
.supplyrow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.supplyrow{grid-template-columns:1fr}}
.supplyrow h4{font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.supplyrow .lbl{display:flex;margin-bottom:6px}
.finrow{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.finrow.wrap{row-gap:10px}
.poach{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#FBFCFD}
.poach b{font-size:13px}
.poachrow{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap}
.autopilot-note{background:#F2F4F7;border-radius:8px;padding:10px 12px;color:var(--mut);font-size:13.5px;margin:0}
.researchgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.research{text-align:left;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:10px;display:flex;flex-direction:column;gap:4px}
.research b{font-size:13.5px}
.research span{font-size:12px;color:var(--mut)}
.research em{font-style:normal;font-family:var(--mono);font-weight:600;font-size:13px}
.research.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.submitbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 -4px 18px rgba(24,36,48,.08);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.submitbar.inline{position:static;box-shadow:none;justify-content:flex-start}
.submitbar .ok{color:var(--ok);font-weight:600}

/* ============================================================= TRADE */
.offer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;margin-bottom:8px;background:#FBFCFD}
.offer b{font-size:14px}
.acceptbox{display:inline-flex;gap:6px;align-items:center;margin-left:auto}

/* ============================================================ REPORTS */
.reporthead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.sparks{display:flex;gap:18px;flex-wrap:wrap}
.sparks .mini{display:block;margin-bottom:2px}
.spark{display:block}
.spark-empty{color:var(--mut);font-size:12px;padding:20px 0}
.rr{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.rr:first-child{border-top:none;margin-top:0;padding-top:0}
.rr h4{font-size:14px;margin-bottom:6px}
.bigrating{font-family:var(--disp);font-weight:900;font-stretch:125%;font-size:64px;line-height:1;margin-bottom:8px}

/* ========================================================== INSTRUCTOR */
.modrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pendinglist{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}

/* ============================================================ PRESENT */
.present{background:var(--ink);color:#F2F4F7;border-radius:14px;padding:28px;min-height:70vh}
.present-title{font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:clamp(26px,4vw,44px);letter-spacing:.03em;margin-bottom:18px}
.present-sub{font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:15px;letter-spacing:.08em;color:#9FB0C0;margin-bottom:10px}
.present-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:900px){.present-grid{grid-template-columns:1fr}}
.present-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:clamp(16px,2vw,22px)}
.present-row .pos{font-family:var(--disp);font-weight:900;font-stretch:125%;width:34px;font-size:clamp(18px,2.2vw,26px)}
.present-row .rname{font-weight:700;flex:1}
.present-row .val{font-family:var(--mono);font-size:clamp(15px,1.8vw,20px)}
.present .wire-item{background:rgba(255,255,255,.07);color:#F2F4F7}
.present .empty{border-color:rgba(255,255,255,.25);color:#9FB0C0}
.present-segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:24px}
.present .segline .mini{color:#9FB0C0}
.present .sharebar{background:rgba(255,255,255,.14)}
.present .sharebar i{border-right-color:var(--ink)}

/* ============================================================== LOBBY */
.lobby{max-width:980px;margin:0 auto;padding:40px 18px 60px}
.lobby-hero{text-align:center;margin-bottom:30px}
.lobby-hero.small{margin-bottom:16px}
.brandmark{color:var(--ink);margin-bottom:6px}
.lobby-hero h1{font-weight:900;font-stretch:125%;font-size:clamp(38px,7vw,64px);letter-spacing:.02em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--ink) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:var(--mut);max-width:560px;margin:8px auto 0;font-size:16px}
.lobby-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.lobby-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;box-shadow:var(--shadow)}
.lobby-card.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink),var(--shadow)}
.lobby-card h2{font-weight:800;font-stretch:112%;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
.lobby-card h2 .mini{text-transform:none;letter-spacing:0;font-family:var(--body);font-weight:600;color:var(--accent)}
.lobby-card p{color:var(--mut);font-size:14px;margin:4px 0 0}
.lobby-form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.lobby-foot{text-align:center;color:var(--mut);font-size:13px;margin-top:34px}

/* ============================================================ DEMOBAR */
.demobar{display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:0 0 12px 12px;padding:8px 14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.demobar b{font-family:var(--disp);font-weight:800;font-stretch:115%;text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.demobar .btn{border-color:#5C6B7A;background:transparent;color:#fff}
.demobar .btn.primary{background:var(--accent);border-color:var(--accent)}
</style>
</head>

<script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
