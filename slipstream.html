function DecideTab({ world, tid, draft, setDraft, submit, submittedAt }) {
  const f = world.teams[tid];
  const mods = E.eventMods(world);
  const set = (path, v) => { const d = JSON.parse(JSON.stringify(draft)); let o = d; const ks = path.split('.'); for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; setDraft(d); };

  const moraleF = 0.6 + 0.55 * f.morale;
  const capLines = f.lines * E.T.unitsPerLine;
  const capLab = Math.floor(f.workers * E.T.baseProductivity * f.skill * moraleF);
  const plannedLoad = E.SEGMENTS.reduce((a, s) => a + (draft.segs[s].active ? (draft.production[s] || 0) * E.SEG_META[s].load : 0), 0);
  const kitNeed = { 1: 0, 2: 0, 3: 0 };
  E.SEGMENTS.forEach(s => { if (draft.segs[s].active) kitNeed[draft.segs[s].kitTier] += draft.production[s] || 0; });
  const kitIncoming = t => f.kitOrders.filter(o => o.tier === t).reduce((a, o) => a + o.qty, 0) + f.contracts.filter(c => c.tier === t).reduce((a, c) => a + c.qtyPerQ, 0);

  const spendPlan = E.SEGMENTS.reduce((a, s) => a + (world.modules.marketing ? draft.marketing[s] || 0 : 0), 0)
    + [1, 2, 3].reduce((a, t) => a + (draft.buyKits.spot[t] || 0) * E.spotKitPrice(world, t, mods, draft.buyKits.spot[t] || 0), 0)
    + (draft.finance.buyLines || 0) * E.T.lineCost + (draft.hr.training || 0);

  return (
    <div>
      <div className="capstrip">
        <Stat label="Line capacity" value={fmt.num(capLines)} />
        <Stat label="Labour capacity" value={fmt.num(capLab)} tone={plannedLoad > capLab ? 'warn' : ''} />
        <Stat label="Planned load" value={fmt.num(Math.round(plannedLoad))} tone={plannedLoad > Math.min(capLab, capLines) ? 'warn' : ''} />
        <Stat label="Cash now" value={fmt.eur0(f.cash)} />
        <Stat label="Planned outlays" value={fmt.eur0(spendPlan)} tone={spendPlan > f.cash ? 'warn' : ''} />
      </div>
      {plannedLoad > Math.min(capLab, capLines) && <div className="banner warn">Your plan exceeds capacity — production will be cut proportionally at the {capLines <= capLab ? 'assembly lines' : 'workforce'}.</div>}

      <Section title="Products, prices and production">
        <div className="segcards">
          {E.SEGMENTS.map(s => {
            const sd = draft.segs[s];
            const ue = unitEconomics(world, f, s, sd.kitTier, sd.price);
            const have = f.kits[sd.kitTier];
            return (
              <div key={s} className={'segcard' + (sd.active ? '' : ' off')}>
                <div className="segcard-head">
                  <b>{E.SEG_META[s].label}</b>
                  <Toggle on={sd.active} onChange={v => set('segs.' + s + '.active', v)} label={sd.active ? 'In market' : 'Not offered'} />
                </div>
                {sd.active && <div className="segcard-body">
                  <label className="lbl">List price € <Num value={sd.price} onChange={v => set('segs.' + s + '.price', v)} step={10} width={100} /></label>
                  <label className="lbl">Component kit
                    <select className="sel" value={sd.kitTier} onChange={e => set('segs.' + s + '.kitTier', Number(e.target.value))}>
                      {[1, 2, 3].map(t => <option key={t} value={t}>T{t} · quality {E.T.kitTiers[t].quality}</option>)}
                    </select>
                  </label>
                  <label className="lbl">Build this quarter <Num value={draft.production[s]} onChange={v => set('production.' + s, v)} step={10} width={100} /></label>
                  <div className="ue">
                    <span>Unit cost ≈ €{fmt.num(ue.cost)} <em>(kit {fmt.num(ue.kitC)} + labour {fmt.num(ue.labour)} + parts {fmt.num(ue.parts + 40)})</em></span>
                    <span className={ue.margin < 0 ? 'neg' : 'pos'}>Margin ≈ €{fmt.num(ue.margin)} ({Math.round(ue.marginPct * 100)}%)</span>
                    <span className="mini">In stock: {fmt.num(f.fg[s].units)} finished · T{sd.kitTier} kits: {fmt.num(have)}{kitNeed[sd.kitTier] > have ? ' — short ' + fmt.num(kitNeed[sd.kitTier] - have) : ''}</span>
                    {world.modules.marketing && <label className="lbl">Marketing € <Num value={draft.marketing[s]} onChange={v => set('marketing.' + s, v)} step={10000} width={110} /></label>}
                  </div>
                </div>}
              </div>
            );
          })}
        </div>
        <p className="mini foot">Reference prices buyers anchor on: {E.SEGMENTS.map(s => E.SEG_META[s].label + ' €' + fmt.num(E.SEG_META[s].refPrice)).join(' · ')}. Ref price ≠ right price.</p>
      </Section>

      <Section title="Components" right={<span className="mini">supplier utilisation {Math.round(world.supplier.util * 100)}%</span>}>
        {!world.modules.supply && <p className="autopilot-note">Procurement runs automatically for now: purchasing buys next quarter's plan at spot prices. You take the wheel when the supply chain module unlocks.</p>}
        {world.modules.supply && <div className="supplyrow">
          <div>
            <h4>Spot orders <span className="mini">paid now, delivered next quarter</span></h4>
            {[1, 2, 3].map(t => (
              <label key={t} className="lbl">T{t} @ €{fmt.num(E.spotKitPrice(world, t, mods, draft.buyKits.spot[t] || 0))}
                <Num value={draft.buyKits.spot[t]} onChange={v => set('buyKits.spot.' + t, v)} step={50} width={100} />
                <em className="mini">stock {fmt.num(f.kits[t])} · incoming {fmt.num(kitIncoming(t))}</em>
              </label>
            ))}
            <p className="mini">Bulk orders earn up to 3.5% off. Spot prices move with industry demand for kits.</p>
          </div>
          <div>
            <h4>Supply contract <span className="mini">3 quarters, locked price ≈ 7% under spot, volume discounts to 6%</span></h4>
            {f.contracts.length > 0 && f.contracts.map((c, i) => <p key={i} className="mini">Active: {fmt.num(c.qtyPerQ)} T{c.tier}/q @ €{fmt.num(c.unitPrice)} — {c.remaining} deliveries left (paid on delivery)</p>)}
            <label className="lbl">Tier
              <select className="sel" value={(draft.newContract && draft.newContract.tier) || 2} onChange={e => set('newContract', { tier: Number(e.target.value), qtyPerQ: (draft.newContract && draft.newContract.qtyPerQ) || 0 })}>
                {[1, 2, 3].map(t => <option key={t} value={t}>T{t}</option>)}
              </select>
            </label>
            <label className="lbl">Kits per quarter <Num value={(draft.newContract && draft.newContract.qtyPerQ) || 0} onChange={v => set('newContract', { tier: (draft.newContract && draft.newContract.tier) || 2, qtyPerQ: v })} step={50} width={100} /></label>
            <p className="mini">Contracts shield you from shortages and spot spikes — and commit you if demand turns.</p>
          </div>
        </div>}
      </Section>

      <Section title="People">
        {!world.modules.hr && <p className="autopilot-note">HR runs automatically for now: the firm hires and releases at the market wage to match your production plan. Full control — wages, training, poaching — unlocks with the HR module.</p>}
        {world.modules.hr && <HRBlock world={world} f={f} draft={draft} set={set} />}
        <p className="mini foot">Workforce {f.workers} assembly + {f.engineers} engineering · skill {f.skill.toFixed(2)} · morale {Math.round(f.morale * 100)}% · your wage €{fmt.num(f.wage)}/q vs market €{fmt.num(world.marketWage)} · labour pool ~{fmt.num(world.labourPool)} people</p>
      </Section>

      <Section title="Finance">
        <div className="finrow">
          <label className="lbl">Draw credit € <Num value={draft.finance.draw} onChange={v => set('finance.draw', v)} step={50000} width={120} /></label>
          <label className="lbl">Repay € <Num value={draft.finance.repay} onChange={v => set('finance.repay', v)} step={50000} width={120} /></label>
          <label className="lbl">Buy lines <Num value={draft.finance.buyLines} onChange={v => set('finance.buyLines', v)} max={6} width={80} /> <em className="mini">€{fmt.eur(E.T.lineCost)} each, online next quarter</em></label>
          <label className="lbl">Sell lines <Num value={draft.finance.sellLines} onChange={v => set('finance.sellLines', v)} max={Math.max(0, f.lines - 1)} width={80} /> <em className="mini">€{fmt.eur(E.T.lineSalvage)} salvage</em></label>
        </div>

function TradeTab({ world, tid, adapter }) {
  const f = world.teams[tid];
  const [kind, setKind] = useState('kits');

  const [seg, setSeg] = useState('city');
  const [qty, setQty] = useState(100);
  const [price, setPrice] = useState(1000);
  const [note, setNote] = useState('');
  const [msg, setMsg] = useState(null);
  const offers = Object.values(world.trades || {}).filter(o => o.open);

  const post = async () => {
    setMsg(null);
    const res = await adapter.mutateWorld(w => E.postTradeOffer(w, tid, { kind, tier, seg, qty, unitPrice: price, note }));
    setMsg(res && res.error ? { warn: res.error } : { ok: 'Offer posted to the floor.' });
  };
  const accept = async (oid, q) => {
    setMsg(null);
    const res = await adapter.mutateWorld(w => E.acceptTradeOffer(w, tid, oid, q));
    setMsg(res && res.error ? { warn: res.error } : { ok: 'Deal done: ' + res.take + ' units for ' + fmt.eur0(res.total) + '.' });
  };
  const cancel = async oid => { await adapter.mutateWorld(w => E.cancelTradeOffer(w, tid, oid)); };

  return (
    <div className="grid2">
      <Section title="Post an offer" right={<span className="mini">deals settle instantly, cash on the barrel</span>}>
        <div className="finrow wrap">
          <label className="lbl">Selling

              <option value="fg">Finished e-bikes</option>
            </select>

          ) : (
            <label className="lbl">Segment <select className="sel" value={seg} onChange={e => setSeg(e.target.value)}>{E.SEGMENTS.map(s => <option key={s} value={s}>{E.SEG_META[s].label} (stock {f.fg[s].units})</option>)}</select></label>
          )}
          <label className="lbl">Quantity <Num value={qty} onChange={setQty} width={90} /></label>
          <label className="lbl">Unit price € <Num value={price} onChange={setPrice} step={10} width={100} /></label>
          <label className="lbl grow">Pitch <input className="txt" maxLength={90} value={note} onChange={e => setNote(e.target.value)} placeholder="e.g. Surplus T2, quick sale before the shortage bites" /></label>
          <button className="btn primary" onClick={post}>Post to floor</button>
        </div>
        <p className="mini">Rebadged bikes carry the seller's quality (minus a little) — buying cheap units to cover a stockout beats empty shelves.</p>
      </Section>
      <Section title={'Trade floor (' + offers.length + ' open)'}>
        {msg && <div className={'banner ' + (msg.warn ? 'warn' : 'ok')}>{msg.warn || msg.ok}</div>}
        {!offers.length && <div className="empty">No open offers. Post one — or work the room and make someone post theirs.</div>}
        {offers.map(o => (
          <div key={o.id} className="offer">
            <Chip color={world.teams[o.from].color}>{world.teams[o.from].name}</Chip>
            <b>{o.qty} × {o.kind === 'kits' ? 'T' + o.tier + ' kits' : E.SEG_META[o.seg].label + ' e-bikes'}</b>
            <span>@ €{fmt.num(o.unitPrice)}</span>
            {o.note && <em className="mini">"{o.note}"</em>}
            {o.from === tid
              ? <button className="btn small" onClick={() => cancel(o.id)}>Withdraw</button>
              : <AcceptBox o={o} onAccept={accept} />}
          </div>
        ))}
      </Section>
    </div>
  );
}

/* --------------------------------------------------- INSTRUCTOR CONSOLE */
function InstructorApp({ world, adapter, demoBar, onSwitchRole }) {
  const [tab, setTab] = useState('control');
  const [busy, setBusy] = useState(false);
  const [subs, setSubs] = useState({});
  useEffect(() => {
    if (adapter.subscribeDecisionCount) return adapter.subscribeDecisionCount(world.q, setSubs);
    let alive = true;
    const poll = () => adapter.getDecisions(world.q).then(d => { if (alive) setSubs(d || {}); });
    poll(); const iv = setInterval(poll, 1500);
    return () => { alive = false; clearInterval(iv); };
  }, [world.q, adapter]);

  const resolve = async () => {
    if (busy || world.finished) return;
    const humanMissing = world.order.filter(id => !world.teams[id].isBot && !subs[id]);
    const msg = humanMissing.length
      ? 'Resolve ' + qLabel(world.q) + '? ' + humanMissing.length + ' team(s) have filed nothing and will run on standing orders: ' + humanMissing.map(id => world.teams[id].name).join(', ')
      : 'Resolve ' + qLabel(world.q) + '? All teams have filed.';
    if (!window.confirm(msg)) return;
    setBusy(true);
    try {
      const decisions = await adapter.getDecisions(world.q) || {};
      // standing orders: a silent team repeats its most recent filing (up to 3 quarters back)
      for (const tidX of world.order) {
        if (world.teams[tidX].isBot || decisions[tidX]) continue;
        for (let back = 1; back <= 3 && world.q - back >= 1; back++) {
          const old = await adapter.getDecisions(world.q - back);
          if (old && old[tidX]) { decisions[tidX] = Object.assign({}, old[tidX], { __autopilot: true }); break; }
        }
      }
      const rng = E.mulberry32((world.seed ^ E.hashStr('live' + world.q + Date.now())) >>> 0);
      const w0 = E.normalizeWorld(JSON.parse(JSON.stringify(world)));
      w0.order.forEach(tidX => { if (w0.teams[tidX].isBot) decisions[tidX] = E.botDecisions(w0, tidX, rng); });
      E.botTradeMoves(w0, rng);
      const { world: w2 } = E.resolveQuarter(w0, decisions);
      await adapter.writeWorld(w2);
    } catch (e) { console.error(e); window.alert('Resolution failed: ' + e.message); }
    setBusy(false);
  };

  const patchWorld = fn => adapter.mutateWorld(w => { fn(w); return true; });

  const tabs = [['control', 'Control'], ['firms', 'Firms'], ['events', 'Events'], ['wire', 'Wire'], ['present', 'Present'], ['export', 'Export']];
  return (
    <div className="app">
      {demoBar}
      <header className="topbar">
        <div className="brand"><i className="jersey big console" /><div><b>Race control</b><span>{world.name}{adapter.code ? ' · world ' + adapter.code : ''}</span></div></div>
        <div className="phase"><b>{world.finished ? 'FINAL' : qLabel(world.q)}</b><span>{world.finished ? 'Season complete' : world.roundOpen ? 'Round open' : 'Resolving'}</span></div>
        <div className="topstats">
          <Stat label="Filed" value={world.order.filter(id => !world.teams[id].isBot && subs[id]).length + '/' + world.order.filter(id => !world.teams[id].isBot).length} />
          <Stat label="Labour pool" value={fmt.num(world.labourPool)} />
          <Stat label="Supplier util." value={Math.round(world.supplier.util * 100) + '%'} />
        </div>
      </header>
      <Peloton world={world} />
      <nav className="tabs" role="tablist">{tabs.map(([k, l]) => <button key={k} role="tab" aria-selected={tab === k} className={'tab' + (tab === k ? ' on' : '')} onClick={() => setTab(k)}>{l}</button>)}</nav>
      <main className="content">
        {tab === 'control' && <ControlTab world={world} subs={subs} resolve={resolve} busy={busy} patchWorld={patchWorld} adapter={adapter} />}
        {tab === 'firms' && <FirmsTab world={world} />}
        {tab === 'events' && <EventsTab world={world} patchWorld={patchWorld} />}
        {tab === 'wire' && <Section title="Everything the wire has run"><Bulletin items={world.newsAll} /></Section>}
        {tab === 'present' && <PresentTab world={world} />}
        {tab === 'export' && <ExportTab world={world} adapter={adapter} />}
      </main>
    </div>
  );
}

  return (

          })}
        </div>
        <p className="mini">Bot-run a slot when a team is absent for a whole session, or to fill an odd grid. Bots decide at resolution.</p>
      </Section>
    </div>
  );
}

function FirmsTab({ world }) {
  const [open, setOpen] = useState(null);
  const rows = world.order.map(id => world.teams[id]).slice().sort((a, b) => b.valuation - a.valuation);
  return (
    <div>
      <Section title="The grid, sorted by company value" tight>
        <table className="fin wide"><thead><tr><th>Firm</th><th className="r">Value</th><th className="r">Cash</th><th className="r">Equity</th><th className="r">Debt</th><th className="r">Rating</th><th className="r">Lines</th><th className="r">People</th><th className="r">Status</th></tr></thead><tbody>
          {rows.map(f => (
            <tr key={f.id} className="rowlink" onClick={() => setOpen(open === f.id ? null : f.id)}>
              <td><Chip color={f.color}>{f.name}</Chip></td>
              <td className="r">{fmt.eur0(f.valuation)}</td>
              <td className="r">{fmt.eur0(f.cash)}</td>
              <td className="r">{fmt.eur0(f.equity)}</td>
              <td className="r">{fmt.eur0(f.debt + f.emergencyDebt)}</td>
              <td className="r">{f.rating}</td>
              <td className="r">{f.lines}</td>
              <td className="r">{f.workers + f.engineers}</td>
              <td className="r">{f.receivership ? <span className="neg">receivership</span> : f.isBot ? 'bot' : f.autopilot ? 'autopilot' : 'live'}</td>
            </tr>
          ))}
        </tbody></table>
        <p className="mini foot">Click a firm for its full statements — instructor eyes only.</p>
      </Section>
      {open && <Section title={world.teams[open].name + ' — full detail'} right={<button className="btn small" onClick={() => setOpen(null)}>Close</button>}>
        <ReportsTab world={world} tid={open} />
      </Section>}
    </div>
  );
}

function EventsTab({ world, patchWorld }) {
  const [custom, setCustom] = useState({ name: '', headline: '', dur: 2, dCity: 0, dBudget: 0, dSport: 0, dCargo: 0, kitCost: 0, supplierCap: 0, rates: 0, wage: 0 });
  const schedule = (ev, when) => patchWorld(w => {
    w.pendingEvents = w.pendingEvents || []; w.activeEvents = w.activeEvents || [];
    const base = { id: ev.id || 'custom' + Date.now(), name: ev.name, headline: ev.headline, effects: ev.effects, dur: ev.dur, remaining: ev.dur };
    if (when === 'now') w.activeEvents.push({ ...base, justStarted: true });
    else w.pendingEvents.push({ ...base, startQ: w.q + 1 });
  });
  const buildCustom = () => {
    const eff = {};
    const dem = {}; if (custom.dCity) dem.city = custom.dCity / 100; if (custom.dBudget) dem.budget = custom.dBudget / 100; if (custom.dSport) dem.sport = custom.dSport / 100; if (custom.dCargo) dem.cargo = custom.dCargo / 100;
    if (Object.keys(dem).length) eff.demand = dem;
    if (custom.kitCost) eff.kitCost = custom.kitCost / 100;
    if (custom.supplierCap) eff.supplierCap = custom.supplierCap / 100;
    if (custom.rates) eff.rates = custom.rates / 100 / 4;
    if (custom.wage) eff.marketWage = custom.wage / 100;
    return { id: 'custom' + Date.now(), name: custom.name || 'Special event', headline: custom.headline || custom.name || 'Something is happening in the market', dur: Math.max(1, custom.dur), effects: eff };
  };
  return (
    <div className="grid2">
      <Section title="Event library" right={<span className="mini">effects apply while the event runs</span>}>
        {E.EVENT_LIBRARY.map(ev => (
          <div key={ev.id} className="offer">
            <b>{ev.name}</b><em className="mini grow">"{ev.headline}" · {ev.dur}q</em>
            <button className="btn small" onClick={() => schedule(ev, 'next')}>Announce, hits next Q</button>
            <button className="btn small primary" onClick={() => schedule(ev, 'now')}>Hit this quarter</button>
          </div>
        ))}
        <div className="pendinglist">
          {(world.pendingEvents || []).map((e, i) => <p key={'p' + i} className="mini">Scheduled: <b>{e.name}</b> from Q{e.startQ} <button className="btn tiny" onClick={() => patchWorld(w => { w.pendingEvents.splice(i, 1); })}>cancel</button></p>)}
          {(world.activeEvents || []).map((e, i) => <p key={'a' + i} className="mini">Live: <b>{e.name}</b> — {e.remaining}q to run</p>)}
        </div>
      </Section>
      <Section title="Build your own">
        <div className="finrow wrap">
          <label className="lbl grow">Name <input className="txt" value={custom.name} onChange={e => setCustom({ ...custom, name: e.target.value })} placeholder="Port strike" /></label>
          <label className="lbl grow">Headline <input className="txt" value={custom.headline} onChange={e => setCustom({ ...custom, headline: e.target.value })} placeholder="Container backlog chokes component imports" /></label>
          <label className="lbl">Duration (q) <Num value={custom.dur} onChange={v => setCustom({ ...custom, dur: v })} min={1} max={8} width={70} /></label>
          <label className="lbl">City demand % <Num value={custom.dCity} onChange={v => setCustom({ ...custom, dCity: v })} min={-80} max={200} width={80} /></label>
          <label className="lbl">Budget demand % <Num value={custom.dBudget} onChange={v => setCustom({ ...custom, dBudget: v })} min={-80} max={200} width={80} /></label>
          <label className="lbl">Sport demand % <Num value={custom.dSport} onChange={v => setCustom({ ...custom, dSport: v })} min={-80} max={200} width={80} /></label>
          <label className="lbl">Cargo demand % <Num value={custom.dCargo} onChange={v => setCustom({ ...custom, dCargo: v })} min={-80} max={200} width={80} /></label>
          <label className="lbl">Kit cost % <Num value={custom.kitCost} onChange={v => setCustom({ ...custom, kitCost: v })} min={-50} max={100} width={80} /></label>
          <label className="lbl">Supplier capacity % <Num value={custom.supplierCap} onChange={v => setCustom({ ...custom, supplierCap: v })} min={-80} max={100} width={80} /></label>
          <label className="lbl">Rates +pp p.a. <Num value={custom.rates} onChange={v => setCustom({ ...custom, rates: v })} min={-5} max={10} width={80} /></label>
          <label className="lbl">Market wage % <Num value={custom.wage} onChange={v => setCustom({ ...custom, wage: v })} min={0} max={50} width={80} /></label>
        </div>
        <div className="submitbar inline">
          <button className="btn" onClick={() => schedule(buildCustom(), 'next')}>Announce, hits next Q</button>
          <button className="btn primary" onClick={() => schedule(buildCustom(), 'now')}>Hit this quarter</button>
        </div>
        <p className="mini">Announcing first lets markets (and rumours) react a quarter early — often the better theatre.</p>
      </Section>
    </div>
  );
}

function PresentTab({ world }) {
  const lastQ = world.q - 1;
  const r = world.resultsByQ[lastQ];
  return (
    <div className="present">
      <h2 className="present-title">{world.finished ? 'FINAL STANDINGS' : r ? qLabel(lastQ) + ' — RESULTS' : 'SEASON START'}</h2>
      <div className="present-grid">
        <div>
          <h3 className="present-sub">General classification</h3>
          {world.order.map(id => world.teams[id]).slice().sort((a, b) => b.valuation - a.valuation).map((f, i) => (
            <div key={f.id} className="present-row">
              <b className="pos">{i + 1}</b><i className="jersey" style={{ background: f.color }} /><span className="rname">{f.name}</span>
              <span className="val">{fmt.eur0(f.valuation)}</span>
              {f.receivership && <span className="neg mini">receivership</span>}
            </div>
          ))}
        </div>
        <div>
          <h3 className="present-sub">The wire</h3>
          <Bulletin items={(world.newsAll || []).filter(n => n.q === lastQ)} big />
        </div>
      </div>
      {r && <div className="present-segs">
        {E.SEGMENTS.map(s => (
          <div key={s} className="segblock">
            <div className="segline"><b>{E.SEG_META[s].label}</b><span className="mini">{fmt.num(r.segs[s].totalSold)} sold · avg €{fmt.num(r.segs[s].avgPrice)}</span></div>
            <div className="sharebar tall">{r.segs[s].firms.filter(x => x.share > 0.005).map(x => <i key={x.tid} style={{ width: (x.share * 100) + '%', background: world.teams[x.tid].color }} />)}</div>
          </div>
        ))}
      </div>}
    </div>
  );
}

function ExportTab({ world, adapter }) {
  const dl = (name, text, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); };
  const exportCSV = () => {
    const rows = [['quarter', 'team', 'valuation', 'revenue', 'ebit', 'cash', 'equity', 'rating', 'receivership']];
    Object.keys(world.resultsByQ || {}).filter(q => world.resultsByQ[q]).forEach(q => {
      const r = world.resultsByQ[q];
      Object.entries(r.firms).forEach(([tid, fr]) => rows.push([q, fr.name, fr.valuation, fr.pnl.revenue, fr.pnl.ebit, fr.bs.cash, fr.bs.equity, fr.rating, fr.receivership ? 1 : 0]));
    });
    dl('slipstream_' + (adapter.code || 'demo') + '.csv', rows.map(r => r.join(',')).join('\n'), 'text/csv');
  };
  return (
    <Section title="Take the season home">
      <div className="submitbar inline">
        <button className="btn" onClick={() => dl('slipstream_world_' + (adapter.code || 'demo') + '.json', JSON.stringify(Object.assign({}, world, { _exportedFrom: adapter.code || null, _exportedAt: new Date().toISOString() }), null, 1), 'application/json')}>Full world (JSON)</button>
        <button className="btn" onClick={exportCSV}>Standings history (CSV)</button>
      </div>
      <p className="mini">The CSV holds every firm's quarterly valuation, revenue, EBIT, cash and equity — ready for grading rubrics or a debrief in R. The JSON is a complete season backup: it can be restored from the lobby onto the same world code (students' codes keep working) or a fresh one.</p>
    </Section>
  );
}

/* ------------------------------------------------------------ ROOT APP */
function DemoBar({ world, current, onSwitch, onReset }) {
  return (
    <div className="demobar">
      <b>Demo</b>
      <button className={'btn tiny' + (current.role === 'instructor' ? ' primary' : '')} onClick={() => onSwitch({ role: 'instructor' })}>Instructor</button>
      {world.order.filter(id => !world.teams[id].isBot).map(id => (
        <button key={id} className={'btn tiny' + (current.role === 'team' && current.tid === id ? ' primary' : '')} onClick={() => onSwitch({ role: 'team', tid: id })}>{world.teams[id].name}</button>
      ))}
      <span className="grow" />
      <button className="btn tiny" onClick={onReset}>Reset demo</button>
    </div>
  );
}

function App() {
  const [adapter, setAdapter] = useState(null);
  const [world, setWorld] = useState(null);
  const [role, setRole] = useState(null);
  const [firebaseReady] = useState(() => {
    try { return !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && window.firebase); } catch (e) { return false; }
  });

  useEffect(() => {
    if (!adapter) return;
    return adapter.subscribe(snap => { if (snap && snap.world) setWorld(E.normalizeWorld(snap.world)); });
  }, [adapter]);

  const enter = (ad, w, r) => {
    setAdapter(ad); setWorld(E.normalizeWorld(w));
    if (r) setRole(r);
    else {
      const saved = sessionStorage.getItem('slipstream_role_' + (ad.code || 'demo'));
      setRole(saved ? JSON.parse(saved) : null);
    }
  };
  const pick = r => { setRole(r); try { sessionStorage.setItem('slipstream_role_' + (adapter.code || 'demo'), JSON.stringify(r)); } catch (e) {} };

  if (!adapter || !world) return <Lobby onEnter={enter} firebaseReady={firebaseReady} />;
  if (!role) return <RolePicker world={world} onPick={pick} />;

  const demoBar = adapter.kind === 'local'
    ? <DemoBar world={world} current={role} onSwitch={setRole} onReset={() => { adapter.reset(); setAdapter(null); setWorld(null); setRole(null); }} />
    : null;

  if (role.role === 'instructor') return <InstructorApp world={world} adapter={adapter} demoBar={demoBar} />;
  return <TeamApp world={world} tid={role.tid} adapter={adapter} demoBar={demoBar} />;
}

/* ---------------------------------------------------------------- BOOT */
(function boot() {
  try {
    if (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.apiKey && window.firebase) {
      firebase.initializeApp(window.FIREBASE_CONFIG);
    }
  } catch (e) { console.warn('Firebase init skipped:', e.message); }
  const rootEl = document.getElementById('root');
  ReactDOM.createRoot(rootEl).render(<App />);
})();

</script>
</body>
